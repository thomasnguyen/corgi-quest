<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="400" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#000">
    Kiro-Powered Activity Pipeline
  </text>
  
  <!-- Action Input -->
  <rect x="250" y="60" width="300" height="60" rx="10" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="400" y="85" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">
    NEW ACTION
  </text>
  <text x="400" y="105" font-size="14" text-anchor="middle" fill="#fff">
    🚶 Walk  🎯 Rep  🧩 Puzzle  🎾 Fetch
  </text>
  
  <!-- Arrow down -->
  <line x1="400" y1="120" x2="400" y2="160" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Mutation Box -->
  <rect x="200" y="160" width="400" height="80" rx="10" fill="#8b5cf6" stroke="#6d28d9" stroke-width="2"/>
  <text x="400" y="185" font-size="16" font-weight="bold" text-anchor="middle" fill="#fff">
    logActivity() mutation
  </text>
  <text x="400" y="205" font-size="12" text-anchor="middle" fill="#fff">
    convex/mutations.ts
  </text>
  <text x="400" y="225" font-size="11" text-anchor="middle" fill="#e9d5ff">
    Kiro-generated fan-out logic
  </text>
  
  <!-- Fan out arrows -->
  <line x1="250" y1="240" x2="150" y2="300" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="350" y1="240" x2="300" y2="300" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="450" y1="240" x2="500" y2="300" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="550" y1="240" x2="650" y2="300" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Database Tables -->
  <rect x="50" y="300" width="150" height="60" rx="8" fill="#10b981" stroke="#059669" stroke-width="2"/>
  <text x="125" y="325" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">
    activities
  </text>
  <text x="125" y="345" font-size="11" text-anchor="middle" fill="#fff">
    table
  </text>
  
  <rect x="225" y="300" width="150" height="60" rx="8" fill="#10b981" stroke="#059669" stroke-width="2"/>
  <text x="300" y="325" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">
    dog_stats
  </text>
  <text x="300" y="345" font-size="11" text-anchor="middle" fill="#fff">
    table
  </text>
  
  <rect x="400" y="300" width="150" height="60" rx="8" fill="#10b981" stroke="#059669" stroke-width="2"/>
  <text x="475" y="325" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">
    daily_goals
  </text>
  <text x="475" y="345" font-size="11" text-anchor="middle" fill="#fff">
    table
  </text>
  
  <rect x="575" y="300" width="150" height="60" rx="8" fill="#10b981" stroke="#059669" stroke-width="2"/>
  <text x="650" y="325" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">
    streaks
  </text>
  <text x="650" y="345" font-size="11" text-anchor="middle" fill="#fff">
    table
  </text>
  
  <!-- Real-time layer -->
  <text x="400" y="390" font-size="12" text-anchor="middle" fill="#6b7280">
    Convex real-time subscriptions notify all listeners instantly
  </text>
  
  <!-- Arrows to UI -->
  <line x1="125" y1="410" x2="150" y2="460" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="300" y1="410" x2="300" y2="460" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="475" y1="410" x2="500" y2="460" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="650" y1="410" x2="650" y2="460" stroke="#000" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- UI Components -->
  <rect x="75" y="460" width="150" height="60" rx="8" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
  <text x="150" y="485" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">
    📊 XP Orbs
  </text>
  <text x="150" y="505" font-size="11" text-anchor="middle" fill="#fff">
    StatOrb.tsx
  </text>
  
  <rect x="250" y="460" width="150" height="60" rx="8" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
  <text x="325" y="485" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">
    🎯 Goals Bar
  </text>
  <text x="325" y="505" font-size="11" text-anchor="middle" fill="#fff">
    TopResourceBar.tsx
  </text>
  
  <rect x="425" y="460" width="150" height="60" rx="8" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
  <text x="500" y="485" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">
    🔥 Streak Badge
  </text>
  <text x="500" y="505" font-size="11" text-anchor="middle" fill="#fff">
    StatsView.tsx
  </text>
  
  <rect x="600" y="460" width="150" height="60" rx="8" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
  <text x="675" y="485" font-size="14" font-weight="bold" text-anchor="middle" fill="#fff">
    🥽 VR HUD
  </text>
  <text x="675" y="505" font-size="11" text-anchor="middle" fill="#fff">
    app.vr.tsx
  </text>
  
  <!-- Footer -->
  <text x="400" y="560" font-size="13" font-weight="bold" text-anchor="middle" fill="#3b82f6">
    No manual wiring • Real-time by default • Same data everywhere
  </text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#000"/>
    </marker>
  </defs>
</svg>
